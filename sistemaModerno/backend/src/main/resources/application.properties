spring.application.name=backend

# Variáveis lidas do ambiente ou do arquivo backend/.env (não versionado; ver .env.example).
spring.config.import=optional:file:.env[.properties]

# --- Banco: Supabase (PostgreSQL) via Session Pooler ---
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# O schema é criado pelas migrations em sistemaModerno/database/supabase/migrations.
# O Hibernate apenas confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=jpetstore
spring.jpa.open-in-view=false

# --- Autenticação (JWT HS256) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.validade=8h

# --- CORS (frontend Vite) ---
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
