spring.application.name=backend

# Variáveis lidas do ambiente ou do arquivo backend/.env (não versionado; ver .env.example).
spring.config.import=optional:file:.env[.properties]

# --- Banco: Supabase (PostgreSQL) via Session Pooler ---
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# O schema é criado pelas migrations em sistemaModerno/database/supabase/migrations.
# O Hibernate apenas confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=jpetstore
spring.jpa.open-in-view=false

# --- Autenticação (JWT HS256) ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.validade=8h

# --- CORS (frontend Vite) ---
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# --- Upload (fotos de até 2 MB e laudos em PDF de até 10 MB; ver LeitorDeArquivos) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
# Lê o restante de um envio recusado, para o cliente receber o erro 413 em vez de conexão cortada.
server.tomcat.max-swallow-size=60MB

app.recuperacao.remetente=${MAIL_FROM:}
app.recuperacao.url-loja=${APP_URL_LOJA:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
